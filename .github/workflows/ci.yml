name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, victory-amd, diagnostico-base]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        run: cargo test --workspace --locked

  windows-release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build optimized Windows x64 executable
        run: cargo build --release -p victory --locked
      - name: Assemble portable package
        shell: pwsh
        run: |
          $package = "dist/victory-windows-x64"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "target/release/victory.exe" $package
          Copy-Item "run-optimized.ps1" $package
          Copy-Item "victory.example.toml" $package
          Copy-Item "README.md" $package
      - uses: actions/upload-artifact@v4
        with:
          name: victory-windows-x64
          path: dist/victory-windows-x64/
          if-no-files-found: error
          retention-days: 14
